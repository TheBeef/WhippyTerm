name: Ubuntu 26.04

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string (the part that would normally follow "Rel_", e.g. 1.0.0.0)'
        required: true
        default: '0.0.0.0'

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    permissions:
      contents: write
    name: Build Ubuntu
    runs-on: ubuntu-26.04

    steps:
    # On a release this is the tag name with the leading "Rel_" stripped;
    # on a manual run it is whatever version string was typed into the input.
    - name: Set version
      id: RelVer
      env:
        INPUT_VERSION: ${{ github.event.inputs.version }}
      run: |
        if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
          echo "substring=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
        else
          echo "substring=${GITHUB_REF_NAME:4}" >> "$GITHUB_OUTPUT"
        fi

    - uses: actions/checkout@v4

    # The Ubuntu 26.04 runner enables the x86-64-v3 package variants, so an
    # unqualified apt-get pulls _amd64v3.deb builds of Qt and the toolchain and
    # the resulting binary refuses to start on any CPU without AVX2.
    # Force plain amd64 so the build matches what end users actually install.
    - name: Disable amd64v3 package variants
      run: |
        echo 'APT::Architecture-Variants "";' | sudo tee /etc/apt/apt.conf.d/99-no-amd64v3
        apt-config dump | grep -i architecture

    - name: Install Dependencies v2
      run: |
        sudo apt-get update && sudo apt-get install -y qt6-base-dev qmake6 qt6-tools-dev qt6-base-dev-tools qt6-multimedia-dev libpipewire-0.3-dev pkg-config fakeroot gzip dpkg
        pkg-config --modversion libpipewire-0.3

    # -march=x86-64 is belt-and-braces: it pins the baseline even if the
    # runner's gcc itself defaults to a higher microarchitecture level.
    - name: Build
      working-directory: ./Project
      run: |
        /usr/lib/qt6/bin/qmake6 WT.pro "QMAKE_CFLAGS+=-march=x86-64 -mtune=generic" "QMAKE_CXXFLAGS+=-march=x86-64 -mtune=generic"
        echo "--- compiler flags qmake generated ---"
        grep -E '^(CFLAGS|CXXFLAGS)' Makefile
        echo "--------------------------------------"
        make -s

    # readelf reports this as a cumulative list, e.g.
    #   x86 ISA needed: x86-64-baseline, x86-64-v2, x86-64-v3
    # so anything above baseline appearing in that list is a failure.
    - name: Verify binary runs on baseline x86-64
      working-directory: ./Project
      run: |
        NEEDED=$(readelf -W -n WhippyTerm | sed -n 's/.*x86 ISA needed:[[:space:]]*//p' | head -1)
        echo "x86 ISA needed: ${NEEDED:-<none recorded>}"
        case "$NEEDED" in
          *x86-64-v2*|*x86-64-v3*|*x86-64-v4*)
            echo "::error::Binary requires above-baseline CPU features ($NEEDED); it will not start on older CPUs"
            exit 1 ;;
          *)
            echo "OK - runs on any x86-64 CPU" ;;
        esac

    - name: deb
      working-directory: ./LinuxInstaller
      env:
        REL_VER: ${{ steps.RelVer.outputs.substring }}
      run: |
        ./MakeRelease.sh "$REL_VER" ../Project 26
        mv "WhippyTerm${REL_VER}-1.deb" "WhippyTerm_${REL_VER}-1_Ubuntu26_04.deb"

#    - name: Setup tmate session
#      uses: mxschmitt/action-tmate@v3

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: WhippyTerm-Ubuntu26_04-${{ steps.RelVer.outputs.substring }}
        path: LinuxInstaller/WhippyTerm_${{ steps.RelVer.outputs.substring }}-1_Ubuntu26_04.deb
        if-no-files-found: error

    - name: Upload Release files
      uses: softprops/action-gh-release@v1
      if: github.event_name == 'release'
      with:
        files: |
          LinuxInstaller/WhippyTerm_${{steps.RelVer.outputs.substring}}-1_Ubuntu26_04.deb
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
