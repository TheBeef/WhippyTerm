name: Ubuntu 26.04

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string (the part that would normally follow "Rel_", e.g. 1.0.0.0)'
        required: true
        default: '0.0.0.0'

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    permissions:
      contents: write
    name: Build Ubuntu
    runs-on: ubuntu-26.04

    steps:
    # On a release this is the tag name with the leading "Rel_" stripped;
    # on a manual run it is whatever version string was typed into the input.
    - name: Set version
      id: RelVer
      env:
        INPUT_VERSION: ${{ github.event.inputs.version }}
      run: |
        if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
          echo "substring=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
        else
          echo "substring=${GITHUB_REF_NAME:4}" >> "$GITHUB_OUTPUT"
        fi

    - uses: actions/checkout@v4

    - name: Install Dependencies v2
      run: |
        sudo apt-get update && sudo apt-get install qt6-base-dev qmake6 qt6-tools-dev qt6-base-dev-tools qt6-multimedia-dev fakeroot gzip dpkg

    - name: Build
      working-directory: ./Project
      run: |
        /usr/lib/qt6/bin/qmake6 WT.pro && make -s

    - name: deb
      working-directory: ./LinuxInstaller
      env:
        REL_VER: ${{ steps.RelVer.outputs.substring }}
      run: |
        ./MakeRelease.sh "$REL_VER" ../Project 26
        mv "WhippyTerm${REL_VER}-1.deb" "WhippyTerm_${REL_VER}-1_Ubuntu26_04.deb"

#    - name: Setup tmate session
#      uses: mxschmitt/action-tmate@v3

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: WhippyTerm-Ubuntu26_04-${{ steps.RelVer.outputs.substring }}
        path: LinuxInstaller/WhippyTerm_${{ steps.RelVer.outputs.substring }}-1_Ubuntu26_04.deb
        if-no-files-found: error

    - name: Upload Release files
      uses: softprops/action-gh-release@v1
      if: github.event_name == 'release'
      with:
        files: |
          LinuxInstaller/WhippyTerm_${{steps.RelVer.outputs.substring}}-1_Ubuntu26_04.deb
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
