name: Ubuntu 26.04

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string (the part that would normally follow "Rel_", e.g. 1.0.0.0)'
        required: true
        default: '0.0.0.0'

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    permissions:
      contents: write
    name: Build Ubuntu
    runs-on: ubuntu-26.04

    # The GitHub 26.04 runner image has the x86-64-v3 package variants enabled,
    # and its preinstalled gcc/glibc are v3 builds. Anything linked on the bare
    # runner is stamped "x86 ISA needed: x86-64-v3" and refuses to start on a CPU
    # without AVX2, no matter what -march the project passes. Building inside a
    # stock ubuntu:26.04 container gives a baseline toolchain that matches what
    # end users actually have installed.
    container:
      image: ubuntu:26.04

    steps:
    # Runs as root in the container, so no sudo. Dependencies go in before
    # checkout so that git is available to actions/checkout.
    - name: Install Dependencies
      run: |
        # Most of Qt6 is in universe; make sure it is enabled in the base image.
        sed -i 's/^Components:.*/Components: main restricted universe multiverse/' \
          /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
        apt-get update
        apt-get install -y \
          build-essential binutils git ca-certificates \
          qt6-base-dev qmake6 qt6-tools-dev qt6-base-dev-tools qt6-multimedia-dev \
          libpipewire-0.3-dev pkg-config fakeroot gzip dpkg
        pkg-config --modversion libpipewire-0.3

    # Confirms the container toolchain is baseline before anything is built.
    - name: Show toolchain microarchitecture
      run: |
        gcc --version | head -1
        echo 'int main(){return 0;}' > /tmp/isa.c
        gcc -march=x86-64 -o /tmp/isa /tmp/isa.c
        printf 'hello-world ISA needed: %s\n' \
          "$(readelf -W -n /tmp/isa | sed -n 's/.*x86 ISA needed:[[:space:]]*//p' | head -1)"
        for o in Scrt1.o crtbegin.o; do
          p=$(gcc -print-file-name=$o)
          printf '%-12s ISA needed: %s\n' "$o" \
            "$(readelf -W -n "$p" 2>/dev/null | sed -n 's/.*x86 ISA needed:[[:space:]]*//p' | head -1)"
        done

    # On a release this is the tag name with the leading "Rel_" stripped;
    # on a manual run it is whatever version string was typed into the input.
    - name: Set version
      id: RelVer
      env:
        INPUT_VERSION: ${{ github.event.inputs.version }}
      run: |
        if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
          echo "substring=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
        else
          echo "substring=${GITHUB_REF_NAME:4}" >> "$GITHUB_OUTPUT"
        fi

    - uses: actions/checkout@v4

    # -march=x86-64 pins the baseline even if Ubuntu raises the amd64 default later.
    - name: Build
      working-directory: ./Project
      run: |
        /usr/lib/qt6/bin/qmake6 WT.pro "QMAKE_CFLAGS+=-march=x86-64 -mtune=generic" "QMAKE_CXXFLAGS+=-march=x86-64 -mtune=generic"
        echo "--- compiler flags qmake generated ---"
        grep -E '^(CFLAGS|CXXFLAGS)' Makefile
        echo "--------------------------------------"
        make -s

    # readelf reports this as a cumulative list, e.g.
    #   x86 ISA needed: x86-64-baseline, x86-64-v2, x86-64-v3
    # so anything above baseline appearing in that list is a failure.
    - name: Verify binary runs on baseline x86-64
      working-directory: ./Project
      run: |
        NEEDED=$(readelf -W -n WhippyTerm | sed -n 's/.*x86 ISA needed:[[:space:]]*//p' | head -1)
        echo "x86 ISA needed: ${NEEDED:-<none recorded>}"
        case "$NEEDED" in
          *x86-64-v2*|*x86-64-v3*|*x86-64-v4*)
            echo "::error::Binary requires above-baseline CPU features ($NEEDED); it will not start on older CPUs"
            exit 1 ;;
          *)
            echo "OK - runs on any x86-64 CPU" ;;
        esac

    - name: deb
      working-directory: ./LinuxInstaller
      env:
        REL_VER: ${{ steps.RelVer.outputs.substring }}
      run: |
        ./MakeRelease.sh "$REL_VER" ../Project 26
        mv "WhippyTerm${REL_VER}-1.deb" "WhippyTerm_${REL_VER}-1_Ubuntu26_04.deb"

#    - name: Setup tmate session
#      uses: mxschmitt/action-tmate@v3

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: WhippyTerm-Ubuntu26_04-${{ steps.RelVer.outputs.substring }}
        path: LinuxInstaller/WhippyTerm_${{ steps.RelVer.outputs.substring }}-1_Ubuntu26_04.deb
        if-no-files-found: error

    - name: Upload Release files
      uses: softprops/action-gh-release@v1
      if: github.event_name == 'release'
      with:
        files: |
          LinuxInstaller/WhippyTerm_${{steps.RelVer.outputs.substring}}-1_Ubuntu26_04.deb
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
